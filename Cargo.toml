[package]
name = "upload-script"
version = "0.1.1"
edition = "2021"
description = "Runs a script of yours on each recorded call, as Trunk Recorder's uploadScript does."
license = "GPL-3.0-or-later"
repository = "https://github.com/TrunkRecorder/trunk-plugin-upload-script"
authors = ["Luke Berndt <lukekb@gmail.com>"]
publish = false

[dependencies]
trunk-recorder-plugin = "0.2.1"
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
strip = true
lto = true
